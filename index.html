<!DOCTYPE html>
<html>
<head>
    <title>My Test Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        ul li {
            margin: 15px 0;
        }
        ul li a {
            display: block;
            background-color: #0366d6;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        ul li a:hover {
            background-color: #024ea4;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Welcome to My Test Hub</h1>
        <p>Choose a test page below:</p>
        
        <ul>
            <li><a href="youtube.html">▶️ YouTube Test</a></li>
            <li><a href="facebook.html">📘 Facebook Test</a></li>
            <li><a href="tiktok.html">🎵 TikTok Test</a></li>
            <li><a href="gmail.html">📧 Gmail Test</a></li>
        </ul>
    </div>
</body>
</html>
